LABEL arch
TEXT HELP
Boot Veyra OS Live on BIOS.
Use Veyra OS Live for rescue and system maintenance.
ENDTEXT
MENU LABEL Veyra OS Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot Veyra OS Live on BIOS with speakup screen reader.
Use Veyra OS Live for rescue and system maintenance with speech feedback.
ENDTEXT
MENU LABEL Veyra OS Live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
